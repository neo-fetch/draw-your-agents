<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe6" />
    <title>graphical-agents · drafting table</title>
    <!-- Theme bootstrap — runs before any stylesheet/bundle so the saved
         theme paints first (no flash of the wrong theme). Key + id list
         duplicate src/theme/themes.ts deliberately; keep in sync. -->
    <script>
      try {
        var t = localStorage.getItem("ga.theme");
        document.documentElement.dataset.theme =
          t === "bathory" ? t : "vellum";
      } catch (e) {
        document.documentElement.dataset.theme = "vellum";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Pirata+One&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f3efe6'/%3E%3Ccircle cx='9' cy='9' r='3' fill='none' stroke='%23211d18' stroke-width='1.6'/%3E%3Ccircle cx='23' cy='23' r='3' fill='%23cf4d2c'/%3E%3Cpath d='M11 10.5 L21 21.5' stroke='%23211d18' stroke-width='1.6'/%3E%3C/svg%3E"
    />
  </head>

  </body>
</html>
